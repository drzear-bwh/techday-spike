<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hotel spike</title>
<style>
  :root { --bg: #f3e9dc; --ink: #2a2522; --card: #fff; --accent: #d9573f; }
  html, body { margin: 0; height: 100%; background: var(--bg); font: 15px/1.4 system-ui, -apple-system, sans-serif; color: var(--ink); overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .hud { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 16px; right: 16px; display: flex; gap: 8px; align-items: center; pointer-events: none; }
  .hud > * { pointer-events: auto; }
  .hud h1 { flex: 1; margin: 0; font-size: 19px; }
  .chip { background: var(--card); padding: 5px 11px; border-radius: 999px; font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.12); border: 0; font: inherit; color: inherit; }
  #back[hidden] { display: none; }
  .labels { position: fixed; inset: 0; pointer-events: none; }
  .labels button { position: absolute; transform: translate(-50%, -100%); pointer-events: auto; border: 0; border-radius: 999px; padding: 4px 10px; font: 600 12px/1.3 system-ui, sans-serif; color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.25); transition: opacity .25s; white-space: nowrap; }
  .labels.off button { opacity: 0; pointer-events: none; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 0 calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(243,233,220,.96) 18px); }
  .row { margin-bottom: 6px; }
  .row h2 { margin: 0 16px 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; opacity: .65; }
  .items { display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 4px; scrollbar-width: none; }
  .items button { flex: none; padding: 9px 13px; border: 0; border-radius: 14px; background: var(--card); color: inherit; font: inherit; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.15); text-align: left; }
  .items button small { display: block; font-weight: 500; opacity: .6; }
  .items button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .hint { margin: 0 16px 8px; font-size: 13px; opacity: .7; }
  .start { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(243,233,220,.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 5; }
  .start[hidden] { display: none; }
  .start div { text-align: center; padding: 24px; }
  .start h2 { margin: 0 0 6px; font-size: 26px; }
  .start p { margin: 0 0 18px; opacity: .75; }
  .start button { border: 0; border-radius: 999px; padding: 14px 26px; background: var(--accent); color: #fff; font: 700 17px system-ui, sans-serif; box-shadow: 0 4px 14px rgba(217,87,63,.4); }
  .start .link { background: none; box-shadow: none; color: inherit; font-weight: 600; padding: 12px; text-decoration: underline; }
</style>
  <script type="module" crossorigin src="./assets/index-Brew8a7b.js"></script>
</head>
<body>
<div id="app"></div>
<div class="labels" id="labels"></div>
<div class="hud">
  <button class="chip" id="back" hidden>← Hotel</button>
  <h1 id="title">Your hotel</h1>
  <button class="chip" id="card" title="Save a picture">📷</button>
  <span class="chip" id="points">0 pts</span>
</div>
<div class="sheet" id="sheet"></div>
<div class="start" id="start">
  <div>
    <h2>Hotel spike</h2>
    <p>Tap a room to decorate it. Tilt your phone to look around.</p>
    <button id="go">Open the doors</button>
  </div>
</div>
<div class="start" id="leave" hidden>
  <div>
    <h2>Leave your hotel?</h2>
    <p>Everything you've built is saved on this phone.</p>
    <button id="stay">Keep building</button>
    <p><button id="bye" class="link">Leave</button></p>
  </div>
</div>
</body>
</html>
